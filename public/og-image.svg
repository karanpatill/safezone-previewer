<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>SafeZoneSnap — see what the app will cover before you post</title>
  <defs>
    <radialGradient id="glow" cx="78%" cy="45%" r="55%">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#fb7185" fill-opacity="0.10"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#fb7185" stroke-opacity="0.38" stroke-width="2"/>
    </pattern>
    <linearGradient id="footage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2230"/>
      <stop offset="0.55" stop-color="#151a24"/>
      <stop offset="1" stop-color="#0f1219"/>
    </linearGradient>
    <clipPath id="screen"><rect x="842" y="65" width="281.25" height="500" rx="22"/></clipPath>
  </defs>

  <rect width="1200" height="630" fill="#08090c"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Brand -->
  <g transform="translate(72 70)">
    <rect x="3.5" y="0.5" width="21" height="30" rx="5" fill="none" stroke="#f4f5f7" stroke-width="2"/>
    <rect x="8" y="6" width="11" height="14.5" rx="1.5" fill="none" stroke="#34d399" stroke-width="2"/>
    <text x="40" y="23" font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.4" fill="#f4f5f7">SafeZoneSnap</text>
  </g>

  <!-- Eyebrow -->
  <g transform="translate(72 168)">
    <circle cx="5" cy="-5" r="5" fill="#34d399"/>
    <circle cx="5" cy="-5" r="9" fill="none" stroke="#34d399" stroke-opacity="0.22" stroke-width="3"/>
    <text x="24" y="0" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="600" letter-spacing="2" fill="#6b7280">FREE · PRIVATE · NO UPLOAD</text>
  </g>

  <!-- Headline -->
  <text font-family="Inter, 'Segoe UI', system-ui, -apple-system, sans-serif" font-size="60" font-weight="650" letter-spacing="-2" fill="#f4f5f7">
    <tspan x="70" y="246">See what the app</tspan>
    <tspan x="70" y="316">will cover before</tspan>
    <tspan x="70" y="386">you post.</tspan>
  </text>
  <text x="72" y="436" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="21" fill="#a8adb8">Pixel-measured safe zones for Reels, TikTok &amp; Shorts on 1080 × 1920.</text>

  <!-- Spec chips -->
  <g font-family="ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace" font-size="15">
    <g transform="translate(72 492)">
      <rect width="196" height="40" rx="10" fill="#0e1015" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="25" fill="#6b7280">Reels</text><text x="182" y="25" text-anchor="end" fill="#f4f5f7">880×1280</text>
    </g>
    <g transform="translate(280 492)">
      <rect width="196" height="40" rx="10" fill="#0e1015" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="25" fill="#6b7280">TikTok</text><text x="182" y="25" text-anchor="end" fill="#f4f5f7">870×1260</text>
    </g>
    <g transform="translate(488 492)">
      <rect width="196" height="40" rx="10" fill="#0e1015" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="16" y="25" fill="#6b7280">Shorts</text><text x="182" y="25" text-anchor="end" fill="#f4f5f7">880×1380</text>
    </g>
  </g>
  <text x="72" y="578" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="15" fill="#6b7280">safezonesnap.com</text>

  <!-- Phone: Reels preset, 1080 × 1920 scaled to 281.25 × 500 (factor 0.2604) -->
  <rect x="826" y="49" width="313.25" height="532" rx="34" fill="#0c0e13" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
  <g clip-path="url(#screen)">
    <rect x="842" y="65" width="281.25" height="500" fill="url(#footage)"/>
    <!-- subject -->
    <circle cx="968" cy="262" r="46" fill="#232a38"/>
    <path d="M896 410c10-62 50-94 72-94s62 32 72 94z" fill="#232a38"/>
    <!-- on-screen headline inside the safe area -->
    <rect x="890" y="160" width="156" height="14" rx="4" fill="#f4f5f7" fill-opacity="0.85"/>
    <rect x="908" y="182" width="120" height="14" rx="4" fill="#f4f5f7" fill-opacity="0.85"/>

    <!-- covered areas: top 220 → 57.3, bottom 420 → 109.4, left 60 → 15.6, right 140 → 36.5 -->
    <rect x="842" y="65" width="281.25" height="57.3" fill="url(#hatch)"/>
    <rect x="842" y="455.6" width="281.25" height="109.4" fill="url(#hatch)"/>
    <rect x="842" y="122.3" width="15.6" height="333.3" fill="url(#hatch)"/>
    <rect x="1086.8" y="122.3" width="36.5" height="333.3" fill="url(#hatch)"/>

    <!-- interface mock -->
    <text x="856" y="104" font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-size="15" font-weight="700" fill="#f4f5f7">Reels</text>
    <rect x="1094" y="91" width="16" height="13" rx="3" fill="none" stroke="#f4f5f7" stroke-width="1.6"/>
    <g fill="none" stroke="#f4f5f7" stroke-width="1.8">
      <path d="M1105 352c-6-6-14 1-8 7l8 8 8-8c6-6-2-13-8-7z"/>
      <rect x="1097" y="384" width="16" height="13" rx="4"/>
      <path d="M1097 430l16-8-5 17-3-6z"/>
    </g>
    <circle cx="864" cy="481" r="9" fill="#a8adb8"/>
    <rect x="880" y="476" width="62" height="9" rx="3" fill="#f4f5f7" fill-opacity="0.9"/>
    <rect x="950" y="472" width="44" height="17" rx="5" fill="none" stroke="#f4f5f7" stroke-opacity="0.8"/>
    <rect x="856" y="499" width="170" height="8" rx="3" fill="#f4f5f7" fill-opacity="0.6"/>
    <rect x="856" y="516" width="110" height="7" rx="3" fill="#f4f5f7" fill-opacity="0.45"/>

    <!-- 4:5 feed crop: 285 px from each end → 74.2 -->
    <line x1="842" y1="139.2" x2="1123.25" y2="139.2" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 5"/>
    <line x1="842" y1="490.8" x2="1123.25" y2="490.8" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="5 5"/>
  </g>

  <!-- safe rectangle 880 × 1280 → 229.2 × 333.3 -->
  <rect x="857.6" y="122.3" width="229.2" height="333.3" rx="3" fill="none" stroke="#34d399" stroke-width="2"/>
  <rect x="925" y="425" width="94" height="22" rx="6" fill="#08090c" fill-opacity="0.85" stroke="#34d399" stroke-opacity="0.5"/>
  <text x="972" y="440.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#34d399">880 × 1280</text>

  <!-- legend -->
  <g font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" fill="#6b7280">
    <rect x="826" y="596" width="10" height="10" rx="2" fill="none" stroke="#34d399" stroke-width="1.6"/><text x="842" y="605">safe</text>
    <rect x="888" y="596" width="10" height="10" rx="2" fill="url(#hatch)" stroke="#fb7185" stroke-opacity="0.6"/><text x="904" y="605">covered</text>
    <line x1="974" y1="601" x2="992" y2="601" stroke="#fbbf24" stroke-width="1.6" stroke-dasharray="4 3"/><text x="998" y="605">4:5 feed</text>
  </g>
</svg>
